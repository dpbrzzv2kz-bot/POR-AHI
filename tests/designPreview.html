</style></head><body><main><aside><div class="eyebrow">DIRECCIÓN VISUAL</div><div class="brand">por ahí <span>↗</span></div><h1>Urbana.<br>Con ganas de salir.</h1><p>Fotos protagonistas, tipografía firme y una navegación que se reconoce de un vistazo.</p><div class="colors"><div><i style="background:#17171c;border:1px solid #62626d"></i><small>GRAFITO</small></div><div><i style="background:#d4ff38"></i><small>LIMA</small></div><div><i style="background:#6929dd"></i><small>VIOLETA</small></div></div><div class="widths" aria-label="Anchura de prueba"><button data-width="320" aria-pressed="false">Compacta</button><button data-width="393" aria-pressed="true">iPhone</button><button data-width="430" aria-pressed="false">Amplia</button></div><p class="caption">Diseño completo · vista web de prueba.<br>Las reseñas son publicaciones públicas existentes.<br>La web pública ya usa este diseño.</p></aside><figure class="device"><iframe title="Por Ahí · vista de diseño" src="/"></iframe><figcaption aria-live="polite">Vista de 393 × 852 px</figcaption></figure></main><script>
