<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA local · Mapa y pasaporte ficticios</title><style>body{margin:0;background:#F5F5F7;color:#17171C;font:16px system-ui}main{max-width:430px;margin:32px auto;padding:18px}h1{font-size:23px}.note{font-size:12px;line-height:1.6;color:#62626D}.card{background:#17171C;border-radius:25px;padding:16px;color:white}.row{display:flex;justify-content:space-between;align-items:center}.kicker{font-size:10px;letter-spacing:2px;color:#ADADB8}.count{font-size:22px;font-weight:900;color:#D4FF38}.frame{width:100%;aspect-ratio:360/142;overflow:hidden;border-radius:14px;margin-top:14px}iframe{border:0;width:100%;height:100%}.rank{color:#D4FF38;font-weight:800}button{width:100%;min-height:44px;border:0;border-radius:15px;background:#ffffff15;color:white;font-weight:700;margin-top:12px;cursor:pointer}.thumb{width:100%;border-radius:20px;margin-top:20px}.stamps{font-size:12px;line-height:1.8;color:#ADADB8}.status{font-size:12px;margin-top:12px;color:#D4FF38}</style><main><h1>Mapa / exportación de prueba</h1><p class="note">DATOS FICTICIOS · QA LOCAL. No es una cuenta ni se publica en Supabase. El iframe usa el generador de mapa final de la app.</p><div class="card"><div class="row"><span class="kicker">ESTADOS RESEÑADOS</span><span class="count" id="count">…</span></div><div class="frame"><iframe id="map" src="map.html" sandbox="allow-scripts" title="Mapa ficticio de estados"></iframe></div><p class="rank">Mochilero · rango 4 / 10</p><div class="stamps" id="states"></div><button id="export">Crear PNG del mapa</button><p id="status" class="status" role="status"></p></div><img id="png" class="thumb" alt="PNG exportado del mapa ficticio" hidden></main><script>const frame=document.getElementById('map'),owner={"name":"Ana · perfil ficticio","handle":"demo_ficticia","rank":"Mochilero"};let request=0;document.getElementById('export').onclick=()=>{request=Date.now();frame.contentWindow.postMessage(JSON.stringify({type:'porahi-map-export-request',request,owner}),'*');document.getElementById('status').textContent='Creando PNG…';};window.addEventListener('message',async(event)=>{if(event.source!==frame.contentWindow||typeof event.data!=='string')return;const data=JSON.parse(event.data);if(data.type==='porahi-map-result'){document.getElementById('count').textContent=data.count+' / '+data.total;document.getElementById('states').textContent=data.regions.map(x=>x.name+' · '+x.country).join(' | ');}if(data.type==='porahi-map-export'&&data.request===request){const img=document.getElementById('png');img.src=data.png;img.hidden=false;const response=await fetch('/export.png',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({png:data.png})});document.getElementById('status').textContent=response.ok?'PNG generado y guardado en QA local':'No se pudo guardar';}});</script></html>
